name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential debhelper devscripts dpkg-dev \
          p7zip-full file unzip zip tar gzip bzip2 xz-utils zstd

    - name: Build binary
      run: make

    - name: Test --list-formats
      run: ./karchiver --list-formats

    - name: Create test archives
      run: |
        mkdir -p /tmp/citest
        cd /tmp/citest
        echo "ci test" > test.txt
        tar czf test.tar.gz test.txt
        zip -q test.zip test.txt
        7z a -bso0 -bsp0 test.7z test.txt >/dev/null 2>&1 || true

    - name: Test safe extraction (tar.gz)
      run: |
        cd /tmp/citest
        ${{ github.workspace }}/karchiver -v -C out_tar test.tar.gz
        cat out_tar/test.txt

    - name: Test safe extraction (zip)
      run: |
        cd /tmp/citest
        ${{ github.workspace }}/karchiver -v -C out_zip test.zip
        cat out_zip/test.txt

    - name: Test safe extraction (7z)
      run: |
        cd /tmp/citest
        if [ -f test.7z ]; then
          ${{ github.workspace }}/karchiver -v -C out_7z test.7z
          cat out_7z/test.txt
        fi

    - name: Test path traversal rejection
      run: |
        cd /tmp/citest
        tar czf evil.tar.gz --transform 's|^|../../|' test.txt || true
        set +e
        ${{ github.workspace }}/karchiver -v -C out_evil evil.tar.gz
        rc=$?
        set -e
        echo "exit code: $rc"
        if [ $rc -eq 0 ]; then
          echo "ERROR: path traversal was not rejected"
          exit 1
        fi
        echo "OK: path traversal rejected"

    - name: Test max-size limit
      run: |
        cd /tmp/citest
        ${{ github.workspace }}/karchiver --max-size 1 -C out_small test.tar.gz || true

    - name: Build Debian package (verbose)
      run: |
        rm -f debian/files
        set +e
        dpkg-buildpackage -us -uc -b > /tmp/build.log 2>&1
        rc=$?
        set -e
        echo "=== dpkg-buildpackage exit code: $rc ==="
        echo "=== last 60 lines of build log ==="
        tail -60 /tmp/build.log
        echo "=== listing parent dir ==="
        ls -la ../
        mkdir -p artifacts
        cp -v ../karchiver_*.deb artifacts/ 2>/dev/null || echo "no karchiver .deb"
        cp -v ../karchiver-dbgsym_*.deb artifacts/ 2>/dev/null || echo "no dbgsym .deb"
        ls -la artifacts/

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: /tmp/build.log
        if-no-files-found: warn

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: karchiver-deb
        path: artifacts/*.deb
        if-no-files-found: warn
