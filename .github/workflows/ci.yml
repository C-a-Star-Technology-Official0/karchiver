name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts dpkg-dev

    - name: Build binary
      run: make

    - name: Test --list-formats
      run: ./karchiver --list-formats

    - name: Create test archives
      run: |
        cd /tmp
        rm -rf citest && mkdir citest && cd citest
        echo "ci test" > test.txt
        tar czf test.tar.gz test.txt
        zip -q test.zip test.txt
        7z a -bso0 -bsp0 test.7z test.txt 2>/dev/null || true

    - name: Test safe extraction (tar.gz)
      run: |
        cd /tmp/citest
        ~/work/karchiver/karchiver/karchiver -v -C out_tar test.tar.gz
        cat out_tar/test.txt

    - name: Test safe extraction (zip)
      run: |
        cd /tmp/citest
        ~/work/karchiver/karchiver/karchiver -v -C out_zip test.zip
        cat out_zip/test.txt

    - name: Test path traversal rejection
      run: |
        cd /tmp/citest
        tar czf evil.tar.gz --transform 's|^|../../|' test.txt
        if ~/work/karchiver/karchiver/karchiver -v -C out_evil evil.tar.gz; then
          echo "ERROR: path traversal was not rejected"
          exit 1
        else
          echo "OK: path traversal rejected"
        fi

    - name: Build Debian package
      run: |
        rm -f debian/files
        dpkg-buildpackage -us -uc -b

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: karchiver-deb
        path: ../karchiver_*.deb
